name: intellifinance

# Ambiente de produção. As imagens são publicadas pelo CI de cada repositório a cada push na main; o
# servidor não compila nada. Primeira subida e deploy automático: ver README.md desta pasta.
# Só o `web` publica porta; banco e API ficam acessíveis apenas pela rede interna.

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: intellifinance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: intellifinance
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellifinance -d intellifinance"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Roda a cada deploy do backend: aplica as migrações pendentes e o seed, que é idempotente e sem
  # SEED_DEMO cria só as categorias do sistema. A API só sobe depois que ele termina com sucesso.
  # Imagem própria porque a CLI do Prisma e o dotenv do seed são devDependencies.
  migrate:
    image: ghcr.io/kaegg/tcc-backend-migrate:${BACKEND_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://intellifinance:${POSTGRES_PASSWORD}@postgres:5432/intellifinance?schema=public
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/prisma/seed.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: ghcr.io/kaegg/tcc-backend:${BACKEND_TAG:-latest}
    restart: unless-stopped
    # Node como PID 1 ignora o SIGTERM do `docker stop`; o init repassa o sinal.
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://intellifinance:${POSTGRES_PASSWORD}@postgres:5432/intellifinance?schema=public
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      # O OriginGuard compara o header Origin com esta lista também em requisição de mesma origem,
      # então ela precisa ser exatamente o endereço que aparece no navegador.
      CORS_ORIGIN: ${PUBLIC_URL:?defina PUBLIC_URL no .env}
      # Um salto: o Caddy. Se houver outro proxy na frente do servidor, aumente.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      TZ: America/Sao_Paulo
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: ghcr.io/kaegg/tcc-frontend:${FRONTEND_TAG:-latest}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?defina SITE_ADDRESS no .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      # Certificados emitidos; sem volume, cada recriação pediria um novo e esbarraria no limite
      # de emissões do Let's Encrypt.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

  # Inferência local do chatbot (RNF06). Fora do `up` padrão até a TCC-020 ligar o backend a ele:
  # `docker compose --profile llm up -d`.
  ollama:
    image: ollama/ollama:0.35.1
    profiles: ["llm"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  ollama_data:
