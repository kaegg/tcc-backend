name: intellifinance

# Ambiente de produção. As imagens são publicadas pelo CI de cada repositório a cada push na main; o
# servidor não compila nada. Primeira subida e deploy automático: ver README.md desta pasta.
# Só o `web` publica porta, e só em 127.0.0.1; banco e API ficam apenas na rede interna.

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: intellifinance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: intellifinance
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellifinance -d intellifinance"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Roda a cada deploy do backend: aplica as migrações pendentes e o seed, que é idempotente e sem
  # SEED_DEMO cria só as categorias do sistema. A API só sobe depois que ele termina com sucesso.
  # Imagem própria porque a CLI do Prisma e o dotenv do seed são devDependencies.
  migrate:
    image: ghcr.io/kaegg/tcc-backend-migrate:${BACKEND_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://intellifinance:${POSTGRES_PASSWORD}@postgres:5432/intellifinance?schema=public
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/prisma/seed.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: ghcr.io/kaegg/tcc-backend:${BACKEND_TAG:-latest}
    restart: unless-stopped
    # Node como PID 1 ignora o SIGTERM do `docker stop`; o init repassa o sinal.
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://intellifinance:${POSTGRES_PASSWORD}@postgres:5432/intellifinance?schema=public
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      # O OriginGuard compara o header Origin com esta lista também em requisição de mesma origem,
      # então ela precisa ser exatamente o endereço que aparece no navegador.
      CORS_ORIGIN: ${PUBLIC_URL:?defina PUBLIC_URL no .env}
      # Caddy e o proxy local à frente dele (cloudflared ou docker-proxy). Seguro também sem
      # túnel: o Caddy sobrescreve o X-Forwarded-For de quem não é proxy confiável.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
      TZ: America/Sao_Paulo
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: ghcr.io/kaegg/tcc-frontend:${FRONTEND_TAG:-latest}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      # Só a própria máquina alcança: o acesso é por túnel SSH e, depois, pelo da Cloudflare.
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      # Estado do Caddy; guarda os certificados se um dia ele servir HTTPS direto.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

  # Inferência local do chatbot (RNF06). Sem porta publicada: só o backend o alcança, por
  # http://ollama:11434. O Ollama não tem autenticação, então não deve ficar exposto.
  # Sem `depends_on` no backend de propósito: Ollama fora do ar derruba só o chatbot, não o CRUD.
  ollama:
    image: ollama/ollama:0.35.1
    restart: unless-stopped
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      # O padrão do Ollama descarrega o modelo após 5 min parado, e a recarga somaria segundos à
      # primeira mensagem depois de cada pausa — distorcendo o tempo do chatbot no estudo.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      # A imagem não traz curl; o próprio CLI consulta o servidor local.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  ollama_data:
