name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancela execucoes antigas do mesmo branch quando chega um push novo, exceto
# na main: cancelar no meio do deploy pode interromper uma migracao.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Somente leitura por padrao; o job de publicacao pede escrita no registry.
permissions:
  contents: read

jobs:
  verificacoes:
    # Push cobre todo commit de toda branch. O gatilho de pull_request fica so
    # para PR vindo de fork, onde o evento de push nao chega a este repositorio.
    # Sem esta condicao, todo commit de branch com PR aberto rodaria duas vezes.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    name: Lint, build e testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intellifinance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/intellifinance_test?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/intellifinance_test?schema=public

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm test

      # Sem isto, os testes de restricao de integridade se pulam sozinhos por
      # falta de tabelas e a suite passa sem exercitar RN02, RN03, RN07 e RN09.
      - name: Aplicar migracoes no banco de teste
        run: npx prisma migrate deploy

      - run: npm run test:e2e

  publicar:
    name: Publicar imagens
    needs: verificacoes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A etapa `runtime` e a API; a etapa `build` vira a imagem do servico
      # `migrate`, que precisa da CLI do Prisma (devDependency).
      - name: API
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/kaegg/tcc-backend:latest
            ghcr.io/kaegg/tcc-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Migracoes
        uses: docker/build-push-action@v7
        with:
          context: .
          target: build
          push: true
          tags: |
            ghcr.io/kaegg/tcc-backend-migrate:latest
            ghcr.io/kaegg/tcc-backend-migrate:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend

  deploy:
    name: Deploy
    needs: publicar
    # DEPLOY_ENABLED (variavel do repositorio) liga o deploy e serve de pausa,
    # por exemplo durante as sessoes do estudo de usabilidade.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    env:
      TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
      SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

    steps:
      - uses: actions/checkout@v7

      # known_hosts vem de segredo, nunca de ssh-keyscan no runner: aceitar a
      # chave que o host apresentar abriria espaco para um servidor falso.
      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Os arquivos versionados aqui sao a fonte da verdade; os do servidor
      # sao copia. O deploy do frontend usa o deploy.sh enviado por este passo.
      - name: Enviar compose e script
        run: scp -i ~/.ssh/id_deploy -P "$SSH_PORT" deploy/docker-compose.yml deploy/deploy.sh "$TARGET:$DEPLOY_PATH/"

      - name: Atualizar API
        run: ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$TARGET" "sh '$DEPLOY_PATH/deploy.sh' backend"
