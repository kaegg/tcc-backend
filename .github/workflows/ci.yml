name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancela execucoes antigas do mesmo branch quando chega um push novo, exceto
# na main: cancelar no meio da publicacao deixaria as imagens de commits
# diferentes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Somente leitura por padrao; o job de publicacao pede escrita no registry.
permissions:
  contents: read

jobs:
  verificacoes:
    # Push cobre todo commit de toda branch. O gatilho de pull_request fica so
    # para PR vindo de fork, onde o evento de push nao chega a este repositorio.
    # Sem esta condicao, todo commit de branch com PR aberto rodaria duas vezes.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    name: Lint, build e testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intellifinance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/intellifinance_test?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/intellifinance_test?schema=public

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm test

      # Sem isto, os testes de restricao de integridade se pulam sozinhos por
      # falta de tabelas e a suite passa sem exercitar RN02, RN03, RN07 e RN09.
      - name: Aplicar migracoes no banco de teste
        run: npx prisma migrate deploy

      - run: npm run test:e2e

  publicar:
    name: Publicar imagens
    needs: verificacoes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A etapa `build` vira a imagem do servico `migrate`, que precisa da CLI do
      # Prisma (devDependency); a etapa `runtime` e a API. Migracoes primeiro: o
      # auto-deploy do servidor so age quando a API muda, e a essa altura a imagem
      # de migracao do mesmo commit ja esta publicada.
      - name: Migracoes
        uses: docker/build-push-action@v7
        with:
          context: .
          target: build
          push: true
          tags: |
            ghcr.io/kaegg/tcc-backend-migrate:latest
            ghcr.io/kaegg/tcc-backend-migrate:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend

      - name: API
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/kaegg/tcc-backend:latest
            ghcr.io/kaegg/tcc-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
